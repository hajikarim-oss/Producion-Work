# ==============================================================================
# TBM PROJECT MANAGEMENT SYSTEM ON TWENTY — PRODUCTION DOCKER COMPOSE
# ==============================================================================
name: tbm-twenty

services:
  server:
    image: twentycrm/twenty:${TAG:-latest}
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - tbm-server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-tbm_secure_db_pass_2026}@db:5432/${PG_DATABASE_NAME:-twenty}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-tbm_}
      APP_SECRET: ${APP_SECRET:-b27cbb9fb07aaa4c3aa13410e6ba1aed4993af4ded963b42f89555b66ead92d4}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-GaXztO3s4Ms1UlrcAhAGCdHYZIkie0IQr8Vyh1/mUyY=}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"

      # SMTP Configuration for The Bored Monkey
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.resend.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-resend}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-re_dummy_resend_api_key}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@theboredmonkey.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-The Bored Monkey}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    image: twentycrm/twenty:${TAG:-latest}
    restart: always
    command: ["yarn", "worker:prod"]
    volumes:
      - tbm-server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-tbm_secure_db_pass_2026}@db:5432/${PG_DATABASE_NAME:-twenty}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-tbm_}
      APP_SECRET: ${APP_SECRET:-b27cbb9fb07aaa4c3aa13410e6ba1aed4993af4ded963b42f89555b66ead92d4}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-GaXztO3s4Ms1UlrcAhAGCdHYZIkie0IQr8Vyh1/mUyY=}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"

      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.resend.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-resend}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-re_dummy_resend_api_key}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@theboredmonkey.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-The Bored Monkey}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -i worker || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - tbm-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-twenty}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-tbm_secure_db_pass_2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-postgres} -d ${PG_DATABASE_NAME:-twenty}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local development mail catcher to test emails safely without real SMTP
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI for reviewing test emails
      - "1025:1025" # SMTP listener

volumes:
  tbm-db-data:
  tbm-server-local-data:
